name: Router model check (temporary)

# Temporary diagnostic: probes a router's free models from a GitHub runner.
# REMOVE after use. The key is never written into this repository; it is only
# a workflow_dispatch input for a single run and is not echoed.

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: API key for router.bynara.id
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check router models
        env:
          ROUTER_KEY: ${{ github.event.inputs.api_key }}
        run: |
          set -Eeuo pipefail
          # Never print the key.
          export MICRO_AI_API_KEYS="$ROUTER_KEY"
          bash -s <<'SCRIPT'
          set -Eeuo pipefail
          echo "== free-tier model probes =="
          ENDPOINT=https://router.bynara.id/v1/chat/completions
          BASE=https://router.bynara.id/v1
          KEY=$MICRO_AI_API_KEYS
          echo "--- GET /models ---"
          curl -sS -m 30 -H "Authorization: Bearer $KEY" "$BASE/models" | head -c 6000 | python3 -m json.tool 2>/dev/null || \
            curl -sS -m 30 -H "Authorization: Bearer $KEY" "$BASE/models" | head -c 2000
          echo
          echo "--- probe free models ---"
          for model in \
            agnes-2.0-flash agnes-2.5-flash glm-5.3-flash-free laguna-s-2.1 \
            minimax-m3-free mistral-large mistral-medium-3-5 nemotron-3-ultra \
            qwen3.8-27b stepfun-3.7-flash tencent-hy3-free deepseek-v4-flash; do
            resp=$(curl -sS -m 60 -w '\n%{http_code}' \
              -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
              -X POST "$ENDPOINT" \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly OK\"}],\"max_tokens\":16}")
            code=$(printf '%s' "$resp" | tail -n 1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [[ "$code" == "200" ]]; then
              reply=$(printf '%s' "$body" | python3 -c 'import json,sys
try:
    d=json.load(sys.stdin); print((d.get("choices") or [{}])[0].get("message",{}).get("content",""))
except Exception: pass' 2>/dev/null)
              printf '%-28s HTTP 200 -> WORKING (%s)\n' "$model" "${reply:-empty}"
            else
              msg=$(printf '%s' "$body" | python3 -c 'import json,sys
try:
    d=json.load(sys.stdin); print(d.get("error",{}).get("message","")[:140])
except Exception: print("")' 2>/dev/null)
              printf '%-28s HTTP %s -> %s\n' "$model" "$code" "${msg:-NO}"
            fi
          done
          SCRIPT
