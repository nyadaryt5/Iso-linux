# Safe defaults. Credential values are never stored here, only file paths.
# Auto routing tries each route in order and falls back to the next provider.
# API model "auto" negotiates the endpoint's /v1/models list automatically;
# Gemini "gemini-auto" picks the best model your cookie pool allows.
AI_PROVIDER=auto
AI_ROUTES=api,gemini,local
AI_BRAIN=1
AI_API_URL=https://api.openai.com/v1/chat/completions
AI_API_MODEL=auto
AI_MODEL_PREFERENCE=
AI_LOCAL_URL=http://127.0.0.1:11434/v1/chat/completions
AI_LOCAL_MODEL=llama3.2:1b
AI_GEMINI_MODEL=gemini-auto
# Paths only: multiple API keys are stored one-per-line in the keys file and
# multiple Gemini accounts are each stored as a JSON export in the cookie dir.
AI_API_KEYS_FILE=
AI_GEMINI_COOKIE_DIR=
AI_RUN_AS_ROOT=0
